services:
  dagster:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DAGSTER_HOME: /app/.dagster_home
      DATA_DIR: /app/data
    volumes:
      - ./mpls_public_safety:/app/mpls_public_safety
      - ./viz:/app/viz
      - ./data:/app/data
      - dagster_home:/app/.dagster_home
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000')",
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s

volumes:
  dagster_home:
